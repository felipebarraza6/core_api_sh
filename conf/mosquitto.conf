# Configuración de Eclipse Mosquitto para SmartHydro

# Basic configuration
pid_file /mosquitto/data/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Security
allow_anonymous true
# password_file /mosquitto/config/passwords

# Listeners
listener 1883 0.0.0.0
protocol mqtt

# listener 8883 0.0.0.0
# protocol mqtt
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key
# tls_version tlsv1.2

# WebSocket support (opcional)
listener 8080 0.0.0.0
protocol websockets

# Bridge configuration para proveedores externos (opcional)
# connection bridge-to-novus
# address mqtt.novus.cl:8883
# topic novus/# both 1 "" bridge-to-novus/
# bridge_cafile /mosquitto/config/ca.crt
# bridge_certfile /mosquitto/config/client.crt
# bridge_keyfile /mosquitto/config/client.key

# Quality of Service
max_queued_messages 1000
max_inflight_messages 20
max_queued_bytes 0

# Resource limits
max_packet_size 1048576
max_keepalive 65535
max_connections -1

# Topic access control
# acl_file /mosquitto/config/acl

# Auto-save on changes
autosave_interval 1800
autosave_on_changes true