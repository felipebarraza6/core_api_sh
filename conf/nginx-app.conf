# ✅ FIX: Configurar logs de nginx en /app/logs/nginx para evitar problemas de permisos
error_log /app/logs/nginx/error.log warn;
access_log /app/logs/nginx/access.log;

server {
    listen 80;
    charset utf-8;
    client_max_body_size 20M;

    # ========================================
    # COMPRESIÓN GZIP
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 200;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ========================================
    # ARCHIVOS ESTÁTICOS CON CACHE
    # ========================================
    location /static {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================
    # ARCHIVOS MEDIA
    # ========================================
    location /media {
        alias /app/media;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ========================================
    # PROXY A GUNICORN
    # ========================================
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ✅ FIX: Preservar el esquema original del request (HTTP o HTTPS)
        # Si ya viene X-Forwarded-Proto del proxy externo, usarlo; si no, usar $scheme
        set $forwarded_proto $http_x_forwarded_proto;
        if ($forwarded_proto = "") {
            set $forwarded_proto $scheme;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # ✅ FIX CORS: Pasar headers de origen para que Django pueda procesar CORS correctamente
        proxy_set_header Origin $http_origin;
        
        # Timeouts optimizados para requests largos
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffers optimizados para requests grandes
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_temp_file_write_size 16k;
        
        # No bufferizar requests pequeños para reducir latencia
        proxy_buffering on;
        proxy_request_buffering on;
        
        # Headers adicionales
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================
    # HEALTHCHECK ENDPOINT (sin cache)
    # ========================================
    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
