# Límite de subida — nginx_proxy (edge real de api.smarthydro.app)
#
# nginx-proxy no define client_max_body_size => default 1m => HTTP 413
# "Content Too Large" en cualquier adjunto de ticket >1 MB
# (POST /api/ik/tickets/<id>/attachments/), aunque la app permite 10 MB.
#
# Se define a nivel http (nginx.conf incluye /etc/nginx/conf.d/*.conf dentro
# de http{}) y NO en vhost.d: el contenedor letsencrypt escribe su bloque
# ACME en /etc/nginx/vhost.d/* y un override por vhost choca con él
# ("duplicate location /.well-known/acme-challenge/" => nginx no arranca).
#
# docker-gen solo regenera conf.d/default.conf, así que este archivo sobrevive
# los reinicios del proxy. Se pierde solo si se recrea el contenedor:
# volver a aplicar con conf/apply_nginx_proxy_conf.sh
#
# Acota también: Cloudflare (100 MB) y el límite de la app (10 MB).

client_max_body_size 20m;
