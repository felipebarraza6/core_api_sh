# Redis configuración de seguridad para SmartHydro
# Generado: 2026-05-20

# Requerir autenticación para todas las conexiones
requirepass KdXsICoCwfxlLY1B0tc8RHsj6ddsTep0

# Deshabilitar comandos peligrosos en producción
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Escuchar solo en la interfaz interna (bind por defecto de la imagen Docker es 0.0.0.0,
# pero la red backend es internal=true, por lo que no es accesible desde fuera)
# No modificamos bind porque Docker maneja la red internamente

# Política de memoria para caché: eliminar claves menos usadas
maxmemory-policy allkeys-lru

# Límite de conexiones (suficiente para Django + cron + posibles workers)
maxclients 100
