# Configuración de Seguridad para Nginx Proxy
# Se monta en /etc/nginx/conf.d/security.conf

# Ocultar versión de Nginx (Muestra "nginx" en lugar de "nginx/1.29.0")
server_tokens off;

# Aumentar tamaño de subida
client_max_body_size 100m;

# Timeouts seguros
client_header_timeout 60s;
client_body_timeout 60s;
send_timeout 60s;

# Permitir que la cabecera Server personalizada del backend pase al cliente
# Esto reemplaza "Server: nginx" con "Server: SmartHydro Secure"
# proxy_pass_header Server;
