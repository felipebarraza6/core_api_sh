# ========================================
# SMARTHYDRO SSL CONFIGURATION
# ========================================

# HTTP upstream (port 8000 de django)
upstream smarthydro_backend {
    server django_api_secure:8000;
    keepalive 2;
}

# ========================================
# HTTP - Redirect ACME challenges and others to HTTPS
# ========================================
server {
    listen 80;
    listen [::]:80;
    server_name api.smarthydro.app;

    # ACME challenge path (sin redirigir a HTTPS)
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Todo lo demás redirige a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ========================================
# HTTPS - API SmartHydro
# ========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.smarthydro.app;

    # ========================================
    # SSL Configuration
    # ========================================
    ssl_certificate /etc/nginx/certs/api.smarthydro.app.crt;
    ssl_certificate_key /etc/nginx/certs/api.smarthydro.app.key;
    ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HSTS Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log vhost;
    error_log /var/log/nginx/error.log warn;

    # ========================================
    # Proxy Configuration
    # ========================================
    location / {
        proxy_pass http://smarthydro_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}
