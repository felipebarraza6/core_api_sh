<!DOCTYPE html>
<html>
<head>
    <title>Prometheus Proxy - Solución localStorage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        #prometheus-frame {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="loading">Cargando Prometheus...</div>
    <iframe id="prometheus-frame" src="http://localhost:9090" onload="hideLoading()"></iframe>

    <script>
        function hideLoading() {
            document.querySelector('.loading').style.display = 'none';
        }

        // Intentar acceder a localStorage para verificar permisos
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            console.log('✅ localStorage funciona correctamente');
        } catch (e) {
            console.error('❌ Error con localStorage:', e);
            // Si hay error, mostrar mensaje alternativo
            document.body.innerHTML = `
                <div style="padding: 40px; text-align: center;">
                    <h1>🔧 Problema con localStorage</h1>
                    <p>El navegador está bloqueando el acceso a localStorage.</p>
                    <p><strong>Soluciones:</strong></p>
                    <ul style="text-align: left; max-width: 600px; margin: 20px auto;">
                        <li>Abre esta página en modo incógnito</li>
                        <li>Desactiva extensiones de bloqueo de anuncios</li>
                        <li>Permite cookies y datos del sitio para localhost</li>
                        <li>Usa un navegador diferente</li>
                    </ul>
                    <p><strong>Acceso directo:</strong> <a href="http://localhost:9090">http://localhost:9090</a></p>
                    <p><strong>API funciona:</strong> <a href="http://localhost:9090/api/v1/targets" target="_blank">Ver targets</a></p>
                </div>
            `;
        }
    </script>
</body>
</html>
