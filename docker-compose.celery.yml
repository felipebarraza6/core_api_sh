version: "3.8"

# ============================================================
# Stack de desarrollo/staging para Celery.
# NO reemplaza docker-compose.production.secure.yml;
# se usa para validar workers y beat antes de pasar a producción.
# ============================================================

services:
  celery_worker:
    build: .
    container_name: celery_worker_dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "celery -A api worker -l info -Q smarthydro -n worker.dev@%h"
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost
      - REDIS_HOST=redis_secure
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - C_FORCE_ROOT=0
    volumes:
      - ./api:/app/api
      - ./void:/app/void
      - ./templates:/app/templates
      - ./static:/app/static
      - ./manage.py:/app/manage.py
      - ./requirements.txt:/app/requirements.txt
      - django_logs:/app/logs
      - google_credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
      redis_secure:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

  celery_beat:
    build: .
    container_name: celery_beat_dev
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "celery -A api beat -l info"
    # Nota: cuando se migre scheduling persistente, cambiar a:
    # --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # y agregar django-celery-beat a requirements.txt con sus migraciones.
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost
      - REDIS_HOST=redis_secure
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./api:/app/api
      - ./void:/app/void
      - ./templates:/app/templates
      - ./static:/app/static
      - ./manage.py:/app/manage.py
      - ./requirements.txt:/app/requirements.txt
      - django_logs:/app/logs
      - google_credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
      redis_secure:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  django_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_logs
  google_credentials:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/credentials
