version: "3.8"

services:
  # ========================================
  # POSTGRESQL - BASE DE DATOS PARA DESARROLLO
  # ========================================
  postgres_dev:
    image: postgres:15-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_DB: smarthydro_dev
      POSTGRES_USER: smarthydro_user
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smarthydro_user -d smarthydro_dev" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========================================
  # REDIS - CACHE PARA DESARROLLO
  # ========================================
  redis_dev:
    image: redis:7-alpine
    container_name: redis_dev
    ports:
      - "6379:6379"
    networks:
      - backend
    restart: unless-stopped

  # ========================================
  # DJANGO API - DESARROLLO LOCAL (SIMPLIFICADO)
  # ========================================
  django_dev:
    build: .
    container_name: django_dev
    environment:
      LOCAL_DB_NAME: smarthydro_dev
      LOCAL_DB_USER: smarthydro_user
      LOCAL_DB_PASSWORD: dev_password_123
      LOCAL_DB_HOST: postgres_dev
      LOCAL_DB_PORT: 5432
      DJANGO_DEBUG: "True"
      USE_CLUSTER: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "dev-secret-key-change-in-production"
      GEMINI_API_KEY: ""
    volumes:
      - ./:/app
      - django_dev_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres_dev:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_dev_data:
  django_dev_static:
  django_dev_media:
  django_dev_logs:

networks:
  backend:
    driver: bridge