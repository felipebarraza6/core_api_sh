version: "3.8"

services:
  # ========================================
  # NGINX PROXY - FRONTEND SEGURO
  # ========================================
  nginx_proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # - ./conf/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_proxy_certs:/etc/nginx/certs:ro
      - nginx_proxy_vhost:/etc/nginx/vhost.d:ro
      - nginx_proxy_html:/usr/share/nginx/html:ro
    networks:
      - frontend
    labels:
      - "com.github.nginx-proxy.docker-gen=true"
    restart: unless-stopped
    # ✅ SEGURIDAD: Usuario no-root
    # user: "101:101"
    # ✅ SEGURIDAD: Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "curl -L http://localhost/ > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # LETSENCRYPT - SSL AUTOMÁTICO
  # ========================================
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_proxy_certs:/etc/nginx/certs:rw
      - nginx_proxy_vhost:/etc/nginx/vhost.d:rw
      - nginx_proxy_html:/usr/share/nginx/html:rw
      - letsencrypt_data:/etc/acme.sh
    environment:
      - NGINX_PROXY_CONTAINER=nginx_proxy
      - NGINX_DOCKER_GEN_CONTAINER=nginx_proxy
    networks:
      - frontend
    depends_on:
      - nginx_proxy
    restart: unless-stopped
    # ✅ SEGURIDAD: Usuario no-root
    # user: "101:101"

    # ========================================
    # REDIS - CACHÉ Y COLAS
    # ========================================
  redis:
    image: redis:7-alpine
    container_name: redis_secure
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ========================================
    # POSTGRESQL 15 - ULTRA-SEGURO
    # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_secure
    environment:
      POSTGRES_DB: smarthydro_prod
      POSTGRES_USER: smarthydro_user
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      # ✅ SEGURIDAD: Variables adicionales
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      # ✅ RENDIMIENTO: Optimizaciones de PostgreSQL
      # shared_buffers: 25% de RAM (ajustar según servidor, típico: 256MB-1GB)
      # work_mem: 4MB por conexión (ajustar según max_connections)
      # effective_cache_size: 50% de RAM (ajustar según servidor)
    command: >
      postgres -c shared_buffers=6GB -c work_mem=64MB -c maintenance_work_mem=1GB -c effective_cache_size=10GB -c max_connections=100 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c max_worker_processes=4 -c max_parallel_workers_per_gather=2 -c max_parallel_workers=4
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db-secure.sql:/docker-entrypoint-initdb.d/init-db-secure.sql:ro
      - postgres_logs:/var/lib/postgresql/data/log
    networks:
      - backend
    restart: unless-stopped
    # ✅ SEGURIDAD: Healthcheck robusto
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smarthydro_user -d smarthydro_prod" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ SEGURIDAD: Usuario no-root
    user: "999:999"
    # ✅ SEGURIDAD: Capabilities limitadas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # ✅ SEGURIDAD: Read-only root filesystem
    read_only: true
    # ✅ SEGURIDAD: Volumes temporales
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # ========================================
  # API DJANGO - API.SMARTHYDRO.APP
  # ========================================
  django:
    build: .
    container_name: django_api_secure
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - DJANGO_DEBUG=False
      - USE_CLUSTER=false
      # ✅ SEGURIDAD: Variables adicionales
      - DJANGO_ALLOWED_HOSTS=${VIRTUAL_HOST}
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://${VIRTUAL_HOST}
      - DJANGO_SECURE_SSL_REDIRECT=True
      - DJANGO_SECURE_HSTS_SECONDS=31536000
      - DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True
      - DJANGO_SECURE_HSTS_PRELOAD=True
      - DJANGO_SECURE_CONTENT_TYPE_NOSNIFF=True
      - DJANGO_SECURE_BROWSER_XSS_FILTER=True
      - DJANGO_SECURE_FRAME_DENY=True
      - DJANGO_SECURE_REFERRER_POLICY=strict-origin-when-cross-origin
      # ✅ RENDIMIENTO: Variables de entorno para Gunicorn
      - GUNICORN_LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      nginx_proxy:
        condition: service_started
      letsencrypt:
        condition: service_started
    expose:
      - "80"
      - "8000"
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # ✅ SEGURIDAD: Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/ > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ✅ SEGURIDAD: Usuario no-root
    user: "1000:1000"
    # ✅ SEGURIDAD: Capabilities limitadas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    # ✅ SEGURIDAD: Read-only root filesystem
    # ✅ SEGURIDAD: Volumes temporales
    tmpfs:
      - /tmp
      - /var/tmp
      - /var/spool/cron

  # ========================================

  # ========================================
  # CRON JOBS - SOLO LOCAL SEGURO
  # ========================================
  cron:
    build: .
    container_name: cron_jobs_secure
    entrypoint: /usr/local/bin/cron-entrypoint.sh
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - USE_CLUSTER=false
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost
    volumes:
      - ./:/app
      - cron_logs:/var/log/smarthydro
      - django_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/smarthydro/twin_1.log && find /tmp/smarthydro/twin_1.log -mmin -5 -print -quit | grep -q twin_1.log" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
      - /var/tmp
    dns:
      - 8.8.8.8
      - 8.8.4.4
# VOLUMENES PERSISTENTES SEGUROS
# ========================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/postgres_data
  postgres_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/postgres_logs
  django_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_static
  django_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_media
  django_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_logs
  cron_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/cron_logs
  nginx_proxy_certs:
    driver: local
  nginx_proxy_vhost:
    driver: local
  nginx_proxy_html:
    driver: local
  letsencrypt_data:
    driver: local

# ========================================
# REDES SEGURAS
# ========================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
