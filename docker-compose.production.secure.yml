version: "3.8"

services:
  # ========================================
  # NGINX PROXY - FRONTEND SEGURO
  # ========================================
  nginx_proxy:
    image: jwilder/nginx-proxy:1.6
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_proxy_certs:/etc/nginx/certs:rw
      - nginx_proxy_vhost:/etc/nginx/vhost.d:rw
      - nginx_proxy_html:/usr/share/nginx/html:rw
    networks:
      - frontend
    labels:
      - "com.github.nginx-proxy.docker-gen=true"
    restart: always
    # ✅ SEGURIDAD: Usuario no-root
    # user: "101:101"
    # ✅ SEGURIDAD: Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -L -H 'Host: api.smarthydro.app' http://localhost/health/ | grep -q '200' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # LETSENCRYPT - SSL AUTOMÁTICO
  # ========================================
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:2.3
    container_name: letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_proxy_certs:/etc/nginx/certs:rw
      - nginx_proxy_vhost:/etc/nginx/vhost.d:rw
      - nginx_proxy_html:/usr/share/nginx/html:rw
      - letsencrypt_data:/etc/acme.sh
    environment:
      - NGINX_PROXY_CONTAINER=nginx_proxy
      - NGINX_DOCKER_GEN_CONTAINER=nginx_proxy
    networks:
      - frontend
    depends_on:
      - nginx_proxy
    restart: unless-stopped
    # ✅ SEGURIDAD: Usuario no-root
    # user: "101:101"

    # ========================================
    # REDIS - CACHÉ Y COLAS
    # ========================================
  redis_secure:
    image: redis:7.2-alpine
    container_name: redis_secure
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ========================================
    # POSTGRESQL 15 - ULTRA-SEGURO
    # ========================================
  postgres:
    image: postgres:15.6-alpine
    container_name: postgres_secure
    environment:
      POSTGRES_DB: smarthydro_prod
      POSTGRES_USER: smarthydro_user
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      # ✅ SEGURIDAD: Variables adicionales
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      # ✅ RENDIMIENTO: Optimizaciones de PostgreSQL
      # shared_buffers: 25% de RAM (ajustar según servidor, típico: 256MB-1GB)
      # work_mem: 4MB por conexión (ajustar según max_connections)
      # effective_cache_size: 50% de RAM (ajustar según servidor)
    command: >
      postgres -c shared_buffers=1536MB -c work_mem=16MB -c maintenance_work_mem=256MB -c effective_cache_size=3GB -c max_connections=100 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c max_worker_processes=2 -c max_parallel_workers_per_gather=1 -c max_parallel_workers=2
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db-secure.sql:/docker-entrypoint-initdb.d/init-db-secure.sql:ro
      - postgres_logs:/var/lib/postgresql/data/log
    networks:
      - backend
    restart: unless-stopped
    # ✅ SEGURIDAD: Healthcheck robusto
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smarthydro_user -d smarthydro_prod" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # ✅ SEGURIDAD: Usuario no-root
    user: "999:999"
    # ✅ SEGURIDAD: Capabilities limitadas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # ✅ SEGURIDAD: Read-only root filesystem
    read_only: true
    # ✅ SEGURIDAD: Volumes temporales
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # ========================================
  # API DJANGO - API.SMARTHYDRO.APP
  # ========================================
  django:
    build: .
    container_name: django_api_secure
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - DJANGO_DEBUG=False
      - USE_CLUSTER=false
      # ✅ SEGURIDAD: Variables adicionales
      - DJANGO_ALLOWED_HOSTS=${VIRTUAL_HOST}
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://${VIRTUAL_HOST}
      - DJANGO_SECURE_SSL_REDIRECT=True
      - DJANGO_SECURE_HSTS_SECONDS=31536000
      - DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True
      - DJANGO_SECURE_HSTS_PRELOAD=True
      - DJANGO_SECURE_CONTENT_TYPE_NOSNIFF=True
      - DJANGO_SECURE_BROWSER_XSS_FILTER=True
      - DJANGO_SECURE_FRAME_DENY=True
      - DJANGO_SECURE_REFERRER_POLICY=strict-origin-when-cross-origin
      # ✅ EMAIL: Variables para envío de correos
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-soporte@smarthydro.cl}
      - PASSWORD_RESET_FROM_EMAIL=${PASSWORD_RESET_FROM_EMAIL:-no-reply@smarthydro.cl}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-soporte@smarthydro.cl}
      # ✅ RENDIMIENTO: Variables de entorno para Gunicorn
      - GUNICORN_LOG_LEVEL=info
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # ✅ COMPLIANCE PROVIDERS: DGA, SMA, Google Chat (migrado desde código hardcodeado)
      - DGA_DEFAULT_PASSWORD=${DGA_DEFAULT_PASSWORD}
      - DGA_BASE_URL=${DGA_BASE_URL:-https://apimee.mop.gob.cl/api/v1}
      - DGA_DEFAULT_RUT_EMPRESA=${DGA_DEFAULT_RUT_EMPRESA:-76944359-2}
      - SMA_BASE_URL=${SMA_BASE_URL:-https://conexiones.sma.gob.cl/api/v1}
      - SMA_USERNAME=${SMA_USERNAME}
      - SMA_PASSWORD=${SMA_PASSWORD}
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL}
      - GOOGLE_CHAT_DGA_WEBHOOK_URL=${GOOGLE_CHAT_DGA_WEBHOOK_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # ✅ SEGURIDAD: Bind mount restringido (NO expone .env, .git/, backups/, credentials/)
      - ./api:/app/api
      - ./templates:/app/templates
      - ./static:/app/static
      - ./scripts:/app/scripts
      - ./conf:/app/conf
      - ./manage.py:/app/manage.py
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./gunicorn_config.py:/app/gunicorn_config.py
      - ./requirements.txt:/app/requirements.txt
      - ./.cron_env.sh:/app/.cron_env.sh
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
      - cron_logs:/app/cron_logs
      - google_credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
      nginx_proxy:
        condition: service_started
      letsencrypt:
        condition: service_started
    expose:
      - "80"
      - "8000"
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # ✅ SEGURIDAD: Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/ > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ✅ SEGURIDAD: Usuario no-root
    user: "1000:1000"
    # ✅ SEGURIDAD: Capabilities limitadas
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    # ✅ SEGURIDAD: Read-only root filesystem
    # ✅ SEGURIDAD: Volumes temporales
    tmpfs:
      - /tmp
      - /var/tmp
      - /var/spool/cron

  # ========================================

  # ========================================
  # CRON JOBS - SOLO LOCAL SEGURO
  # ========================================
  cron:
    build: .
    container_name: cron_jobs_secure
    entrypoint: /app/cron-entrypoint.sh
    environment:
      - LOCAL_DB_NAME=smarthydro_prod
      - LOCAL_DB_USER=smarthydro_user
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}
      - LOCAL_DB_HOST=postgres
      - LOCAL_DB_PORT=5432
      - USE_CLUSTER=false
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost
      - TDATA_USERNAME=${TDATA_USERNAME}
      - TDATA_PASSWORD=${TDATA_PASSWORD}
      # ✅ COMPLIANCE PROVIDERS: DGA, SMA, Google Chat (migrado desde código hardcodeado)
      - DGA_DEFAULT_PASSWORD=${DGA_DEFAULT_PASSWORD}
      - DGA_BASE_URL=${DGA_BASE_URL:-https://apimee.mop.gob.cl/api/v1}
      - DGA_DEFAULT_RUT_EMPRESA=${DGA_DEFAULT_RUT_EMPRESA:-76944359-2}
      - SMA_BASE_URL=${SMA_BASE_URL:-https://conexiones.sma.gob.cl/api/v1}
      - SMA_USERNAME=${SMA_USERNAME}
      - SMA_PASSWORD=${SMA_PASSWORD}
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL}
      - GOOGLE_CHAT_DGA_WEBHOOK_URL=${GOOGLE_CHAT_DGA_WEBHOOK_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # ✅ SEGURIDAD: Bind mount restringido (NO expone .env, .git/, backups/, credentials/)
      - ./api:/app/api
      - ./templates:/app/templates
      - ./scripts:/app/scripts
      - ./conf:/app/conf
      - ./manage.py:/app/manage.py
      - ./cron-entrypoint.sh:/app/cron-entrypoint.sh
      - ./rotate-cron-logs.sh:/app/rotate-cron-logs.sh
      - ./requirements.txt:/app/requirements.txt
      - ./.cron_env.sh:/app/.cron_env.sh
      - cron_logs:/var/log/smarthydro
      - django_logs:/app/logs
      - google_credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    # ✅ SEGURIDAD: Usuario no-root (mismo UID que servicio django)
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/smarthydro/unified_twin_1.log && find /tmp/smarthydro/unified_twin_1.log -mmin -5 -print -quit | grep -q unified_twin_1.log" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /tmp
      - /var/tmp
    dns:
      - 8.8.8.8
      - 8.8.4.4
# VOLUMENES PERSISTENTES SEGUROS
# ========================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/postgres_data
  postgres_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/postgres_logs
  django_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_static
  django_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_media
  django_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/django_logs
  cron_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/cron_logs
  google_credentials:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/smarthydro/credentials
  nginx_proxy_certs:
    driver: local
  nginx_proxy_vhost:
    driver: local
  nginx_proxy_html:
    driver: local
  letsencrypt_data:
    driver: local

# ========================================
# REDES SEGURAS
# ========================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
