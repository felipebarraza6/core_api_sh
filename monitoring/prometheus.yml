global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'django_app'
    metrics_path: '/metrics/'
    static_configs:
      - targets: ['django-app:8000']

  - job_name: 'celery_worker'
    static_configs:
      - targets: ['celery_worker:9200']

  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']