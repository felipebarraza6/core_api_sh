global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'smarthydro_postgres'
    static_configs:
      - targets: ['postgres_exporter_dev:9187']

  - job_name: 'smarthydro_redis'
    static_configs:
      - targets: ['redis_exporter_dev:9121']

  - job_name: 'django_app'
    static_configs:
      - targets: ['django_dev:8000']

  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']