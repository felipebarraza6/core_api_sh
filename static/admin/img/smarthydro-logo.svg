<svg width="200" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente azul -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d7bb3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#569cd6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icono de gota de agua -->
  <path d="M 15 10 Q 15 5 20 5 Q 25 5 25 10 L 25 25 Q 25 35 20 40 Q 15 45 20 45 Q 25 45 30 40 Q 35 35 35 25 L 35 10 Q 35 5 30 5 Q 25 5 25 10 Z" 
        fill="url(#logoGradient)" 
        stroke="#ffffff" 
        stroke-width="1.5"/>
  
  <!-- Texto SmartHydro -->
  <text x="50" y="35" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="700" 
        fill="url(#logoGradient)">
    SmartHydro
  </text>
  
  <!-- L�nea decorativa -->
  <line x1="50" y1="42" x2="190" y2="42" 
        stroke="url(#logoGradient)" 
        stroke-width="3" 
        stroke-linecap="round"/>
</svg>
